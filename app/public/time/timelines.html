<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>time.somacosf.com — Position Timelines</title>
  <style>
    :root {
      --bg: #050508;
      --bg2: #0a0b12;
      --panel: #0f1019;
      --border: #1b1d2a;
      --text: #e6e6f0;
      --muted: #7a7f96;
      --amber: #FF9000;
      --cyan: #00CCDD;
      --green: #00DD66;
      --red: #ff4d4d;
      --blue: #4d8eff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      -webkit-font-smoothing: antialiased;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(5,5,8,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
    }
    .brand h1 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
    }
    .metrics {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .metric {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .metric-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .metric-value {
      font-size: 13px;
      color: var(--cyan);
    }
    main {
      padding: 20px 24px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .section {
      margin-bottom: 28px;
    }
    .section-title {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .ticker {
      font-size: 12px;
      color: var(--text);
      word-break: break-word;
    }
    .badge {
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .badge-open {
      color: var(--green);
      border-color: var(--green);
      background: rgba(0,221,102,0.08);
    }
    .badge-closed {
      color: var(--muted);
      border-color: var(--muted);
      background: rgba(122,127,150,0.08);
    }
    .badge-cash {
      color: var(--amber);
      border-color: var(--amber);
      background: rgba(255,144,0,0.08);
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }
    .label {
      color: var(--muted);
    }
    .value {
      color: var(--text);
      text-align: right;
    }
    .value-profit {
      color: var(--green);
    }
    .value-loss {
      color: var(--red);
    }
    .timeline {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline-bar-wrap {
      height: 8px;
      border-radius: 999px;
      background: var(--bg2);
      overflow: hidden;
    }
    .timeline-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--cyan), var(--blue));
    }
    .timeline-bar.profit {
      background: linear-gradient(90deg, var(--green), var(--cyan));
    }
    .timeline-bar.loss {
      background: linear-gradient(90deg, var(--red), var(--amber));
    }
    .fill-list {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fill-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      color: var(--muted);
      border-top: 1px dashed var(--border);
      padding-top: 6px;
    }
    .fill-row .fill-action {
      color: var(--text);
    }
    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
    .error {
      padding: 18px;
      background: rgba(255,77,77,0.08);
      border: 1px solid var(--red);
      border-radius: 10px;
      color: var(--red);
      font-size: 12px;
      margin-bottom: 18px;
    }
    .footer {
      padding: 0 24px 30px;
      max-width: 1400px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 11px;
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <div class="brand-mark"></div>
      <h1>time.somacosf.com — Position Timelines</h1>
    </a>
    <div class="metrics">
      <div class="metric">
        <div class="metric-label">Positions</div>
        <div class="metric-value" id="metric-positions">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Open</div>
        <div class="metric-value" id="metric-open">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Closed</div>
        <div class="metric-value" id="metric-closed">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Fills</div>
        <div class="metric-value" id="metric-fills">—</div>
      </div>
      <div class="metric">
        <div class="metric-label">Updated</div>
        <div class="metric-value" id="metric-updated">—</div>
      </div>
    </div>
  </header>
  <main>
    <div id="error" class="error" style="display:none;"></div>
    <section class="section">
      <h2 class="section-title">Open Positions</h2>
      <div id="open-positions"></div>
    </section>
    <section class="section">
      <h2 class="section-title">Closed Positions</h2>
      <div id="closed-positions"></div>
    </section>
    <section class="section">
      <h2 class="section-title">Recent Fills</h2>
      <div id="recent-fills"></div>
    </section>
  </main>
  <div class="footer">Data source: local API at /api/portfolio + /api/fills · Auto-refresh 15s</div>

  <script>
    const LOCAL_API = "/api"
    const REFRESH_MS = 15000

    function fmt$(v) {
      const n = Number(v)
      if (!Number.isFinite(n)) return '—'
      return `$${n.toFixed(2)}`
    }
    function fmtPct(v) {
      const n = Number(v)
      if (!Number.isFinite(n)) return '—'
      return `${(n * 100).toFixed(1)}¢`
    }
    function fmtTime(iso) {
      if (!iso) return '—'
      const d = new Date(iso)
      if (Number.isNaN(d.getTime())) return String(iso)
      return d.toLocaleString('en-US', {
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      })
    }
    function badge(status) {
      const map = {
        open: 'badge-open',
        closed: 'badge-closed',
        cash: 'badge-cash',
      }
      const label = status === 'cash' ? 'cash' : status === 'open' ? 'open' : 'closed'
      return `<span class="badge ${map[status] || 'badge-open'}">${label}</span>`
    }
    function card(html) {
      return `<div class="card">${html}</div>`
    }
    function row(label, value, extra) {
      return `<div class="row"><div class="label">${label}</div><div class="value ${extra || ''}">${value}</div></div>`
    }

    function renderPositions(positions, fills, containerId) {
      const container = document.getElementById(containerId)
      if (!container) return
      if (!positions.length) {
        container.innerHTML = card('<div class="empty">No positions.</div>')
        return
      }
      container.innerHTML = '<div class="grid">' + positions.map((p, i) => {
        const entryPrice = Number(p.avg_price || 0)
        const currentPrice = Number(p.current_price || 0)
        const count = Number(p.count || 0)
        const notional = entryPrice * count
        const pnl = Number(p.pnl || 0)
        const pnlClass = pnl > 0 ? 'value-profit' : pnl < 0 ? 'value-loss' : ''
        const status = p.ticker === '__cash__' ? 'cash' : p.status === 'closed' ? 'closed' : 'open'
        const progress = entryPrice > 0 ? Math.min(100, Math.max(0, (currentPrice / entryPrice) * 100)) : 0
        const timelineClass = pnl > 0 ? 'profit' : pnl < 0 ? 'loss' : ''
        const positionFills = fills
          .filter(f => (f.market_ticker || f.ticker) === p.ticker)
          .slice(0, 8)
        const fillsHtml = positionFills.length
          ? '<div class="fill-list">' + positionFills.map(f => `
              <div class="fill-row">
                <div class="fill-action">${f.action || ''} ${f.outcome_side || ''}</div>
                <div>${fmtPct(f.price_dollars)}</div>
                <div>${Number(f.count_fp || 0).toFixed(2)}</div>
                <div>${fmt$(f.fee_dollars)}</div>
                <div>${fmtTime(f.created_time)}</div>
              </div>
            `).join('') + '</div>'
          : ''
        return card(
          `<div class="card-header"><div class="ticker">${p.ticker}</div>${badge(status)}</div>` +
          row('Side', p.side || '—') +
          row('Count', count.toFixed(2)) +
          row('Entry', fmtPct(entryPrice)) +
          (status === 'closed'
            ? row('Exit', fmtPct(currentPrice))
            : row('Mark', fmtPct(currentPrice))) +
          row('Notional', fmt$(notional)) +
          row('P&L', fmt$(pnl), pnlClass) +
          row(status === 'cash' ? 'Cash' : status === 'closed' ? 'Closed' : 'Opened', fmtTime(p.created_time)) +
          (status === 'closed' && p.closed_time ? row('Closed', fmtTime(p.closed_time)) : '') +
          (status === 'open' ? `<div class="timeline"><div class="timeline-bar-wrap"><div class="timeline-bar ${timelineClass}" style="width:${progress}%"></div></div></div>` : '') +
          fillsHtml
        )
      }).join('') + '</div>'
    }

    function renderFills(fills) {
      const container = document.getElementById('recent-fills')
      if (!container) return
      if (!fills.length) {
        container.innerHTML = card('<div class="empty">No fills recorded.</div>')
        return
      }
      container.innerHTML = '<div class="grid">' + fills.slice(0, 50).map((f, i) => {
        const action = String(f.action || '').toLowerCase()
        const side = String(f.outcome_side || '').toLowerCase()
        const price = Number(f.price_dollars || 0)
        const count = Number(f.count_fp || 0)
        const fee = Number(f.fee_dollars || 0)
        return card(
          `<div class="card-header"><div class="ticker">${f.market_ticker || f.ticker || '—'}</div><span class="badge badge-open">${action} ${side}</span></div>` +
          row('Price', fmtPct(price)) +
          row('Count', count.toFixed(2)) +
          row('Fee', fmt$(fee)) +
          row('Time', fmtTime(f.created_time))
        )
      }).join('') + '</div>'
    }

    async function j(path, opts) {
      const res = await fetch(path, opts)
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`)
      return res.json()
    }

    async function load() {
      try {
        const [posJson, fillsJson] = await Promise.all([
          j('/api/portfolio').catch(() => ({ positions: [], cash: 0 })),
          j('/api/fills?limit=200').catch(() => ({ fills: [] })),
        ])
        const positions = Array.isArray(posJson.positions?.event_positions) ? posJson.positions.event_positions : []
        if (posJson.balance?.balance_dollars !== undefined && posJson.balance?.balance_dollars !== null) {
          positions.unshift({
            ticker: '__cash__',
            side: 'cash',
            count: 1,
            avg_price: Number(posJson.balance.balance_dollars),
            current_price: Number(posJson.balance.balance_dollars),
            pnl: 0,
            status: 'open',
            created_time: new Date().toISOString(),
          })
        }
        const fills = Array.isArray(fillsJson.fills) ? fillsJson.fills : []
        const openPositions = positions.filter(p => p.status === 'open' || !p.status)
        const closedPositions = positions.filter(p => p.status === 'closed')
        document.getElementById('metric-positions').textContent = positions.length
        document.getElementById('metric-open').textContent = openPositions.length
        document.getElementById('metric-closed').textContent = closedPositions.length
        document.getElementById('metric-fills').textContent = fills.length
        document.getElementById('metric-updated').textContent = new Date().toLocaleTimeString('en-US', { hour12: false })
        renderPositions(openPositions, fills, 'open-positions')
        renderPositions(closedPositions, fills, 'closed-positions')
        renderFills(fills)
        document.getElementById('error').style.display = 'none'
      } catch (e) {
        const el = document.getElementById('error')
        el.textContent = e?.message || 'Failed to load timeline data'
        el.style.display = 'block'
      }
    }

    load()
    setInterval(load, REFRESH_MS)
  </script>
</body>
</html>
